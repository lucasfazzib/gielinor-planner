[project]
name = "gielinor-planner"
version = "0.1.0"
description = "Old School RuneScape account planner: builds, XP guard, what to do next. Every game fact is traceable to its source."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "duckdb==1.5.6",
    "typer==0.27.3",
    "rich==15.0.0",
    "beautifulsoup4==4.15.0",
    "pyyaml==6.0.3",
    "pytz==2025.2",  # DuckDB needs it to return timestamptz values to Python
]

[project.scripts]
gp = "gp.cli:app"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gp"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
